<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EasyFitness</title>
<style>
  :root{
    --bg:#0d0f14;
    --card:#171a22;
    --card2:#1e222d;
    --line:#2a2f3c;
    --text:#e8ebf0;
    --muted:#8b93a5;
    --accent:#fb923c;      /* moving-part highlight */
    --green:#4ade80;
    --green-dim:#173325;
    --danger:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{max-width:560px;margin:0 auto;padding-bottom:120px}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 16px 8px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .brand h1 span{color:var(--accent)}
  .profile-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;color:var(--text);cursor:pointer}
  .picker{position:fixed;inset:0;background:rgba(13,15,20,.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  .picker h2{font-size:22px;font-weight:800}
  .picker p{color:var(--muted);font-size:14px;margin-top:-6px;text-align:center}
  .picker button{width:100%;max-width:340px;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;font-weight:800;cursor:pointer}
  .picker button:active{border-color:var(--accent)}
  .picker button{background:var(--accent);border-color:var(--accent);color:#181004}
  .name-input{width:100%;max-width:340px;height:56px;border-radius:16px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:18px;font-weight:700;text-align:center;outline:none}
  .name-input:focus{border-color:var(--accent)}
  .user-info{font-size:12.5px;color:var(--muted);text-align:right;margin-top:-6px;margin-bottom:8px;padding-right:4px}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:.2s}
  nav.tabs button.active{background:var(--card2);color:var(--text);border-color:var(--accent)}
  nav.tabs button .sub{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
  nav.tabs button.active .sub{color:var(--accent)}

  main{padding:12px 16px}
  .day-progress{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
  .day-progress .bar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
  .day-progress .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
  .day-progress span{font-size:12.5px;color:var(--muted);font-weight:600;min-width:60px;text-align:right}

  /* ---------- Exercise cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;transition:border-color .3s, background .3s}
  .card.done{border-color:var(--green);background:var(--green-dim)}
  .card-top{display:flex;gap:12px;align-items:flex-start}
  .anim{width:104px;height:86px;flex-shrink:0;background:var(--card2);border-radius:12px;padding:3px}
  .card.done .anim{background:rgba(74,222,128,.08)}
  .anim svg{width:100%;height:100%;display:block}
  .ex-info{flex:1;min-width:0}
  .ex-name{font-size:16px;font-weight:700;line-height:1.25}
  .ex-meta{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
  .done-badge{display:none;font-size:12px;font-weight:800;color:var(--green);margin-top:4px}
  .card.done .done-badge{display:block}

  /* weight chip */
  .weight-row{margin-top:8px}
  .weight-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;min-height:40px}
  .weight-chip.empty{color:var(--muted);font-weight:600;font-style:italic}
  .weight-chip .kg{font-size:12px;color:var(--muted);font-weight:700}
  .weight-chip .db-tag{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(251,146,60,.12);padding:2px 6px;border-radius:6px}
  .weight-edit{display:flex;align-items:center;gap:8px;margin-top:8px}
  .weight-edit button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:22px;font-weight:800;cursor:pointer}
  .weight-edit button.save{width:auto;padding:0 16px;font-size:15px;background:var(--accent);color:#181004;border-color:var(--accent)}
  .weight-edit input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--accent);background:var(--bg);color:var(--text);font-size:17px;font-weight:800;text-align:center;outline:none}

  /* sets */
  .sets{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .set-box{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--muted);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;user-select:none}
  .set-box.on{background:var(--green);border-color:var(--green);color:#0b1f12}

  /* cardio */
  .cardio{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1a2030,#171a22);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;cursor:pointer}
  .cardio.on{border-color:var(--green);background:var(--green-dim)}
  .cardio .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
  .cardio.on .chk{background:var(--green);border-color:var(--green);color:#0b1f12}
  .cardio .t{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}
  .cardio .d{font-size:14.5px;font-weight:600;margin-top:2px}

  .finish-btn{width:100%;padding:18px;border:0;border-radius:var(--radius);background:var(--accent);color:#181004;font-size:17px;font-weight:800;cursor:pointer;margin:6px 0 18px}
  .finish-btn:active{transform:scale(.98)}

  /* notes */
  details.notes{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  details.notes summary{font-weight:800;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  details.notes summary::before{content:"📝"}
  details.notes ul{margin:10px 0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
  details.notes li{margin-bottom:6px}
  details.notes b{color:var(--text)}

  /* ---------- History ---------- */
  .section-title{font-size:16px;font-weight:800;margin:18px 2px 10px}
  .measure-form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .measure-form .row{display:flex;gap:10px;margin-bottom:10px}
  .measure-form label{flex:1;font-size:12.5px;color:var(--muted);font-weight:700}
  .measure-form input{width:100%;margin-top:5px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-weight:700;text-align:center;outline:none}
  .measure-form input:focus{border-color:var(--accent)}
  .measure-form button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--card2);border:1px solid var(--accent);color:var(--accent);font-size:15px;font-weight:800;cursor:pointer}
  .hist-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .hist-item .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hist-item .h b{font-size:15px}
  .hist-item .h span{font-size:12.5px;color:var(--muted);font-weight:600}
  .hist-item ul{list-style:none}
  .hist-item li{font-size:13.5px;color:var(--muted);padding:3px 0;display:flex;justify-content:space-between;gap:10px}
  .hist-item li em{font-style:normal;color:var(--text);font-weight:600}
  .hist-item .cardio-done{font-size:12.5px;color:var(--green);font-weight:700;margin-top:6px}
  .m-item{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px;font-weight:600}
  .m-item span{color:var(--muted);font-weight:600;font-size:13px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px}

  /* ---------- Rest timer ---------- */
  .rest-timer{position:fixed;left:50%;transform:translate(-50%,140px);bottom:16px;width:calc(100% - 32px);max-width:528px;background:var(--card2);border:1px solid var(--accent);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;z-index:50;transition:transform .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .rest-timer.show{transform:translate(-50%,0)}
  .rest-timer .ring{position:relative;width:56px;height:56px;flex-shrink:0}
  .rest-timer .ring svg{transform:rotate(-90deg)}
  .rest-timer .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .rest-timer .lbl{flex:1}
  .rest-timer .lbl b{font-size:15px;display:block}
  .rest-timer .lbl span{font-size:12.5px;color:var(--muted)}
  .rest-timer button{border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:14px;padding:12px 16px;border-radius:12px;cursor:pointer}
  .rest-timer button.skip{border-color:var(--accent);color:var(--accent)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--green);color:#0b1f12;font-weight:800;font-size:14.5px;padding:13px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ================= STICK FIGURE ANIMATIONS ================= */
  .anim line,.anim path,.anim polyline{stroke:#9aa4b2;stroke-width:3;stroke-linecap:round;fill:none}
  .anim circle.head{fill:none;stroke:#9aa4b2;stroke-width:3}
  .anim .hl{stroke:var(--accent)}
  .anim .hlf{fill:var(--accent);stroke:none}
  .anim .gear{stroke:#4b5363;stroke-width:3}
  .anim .cable{stroke:#4b5363;stroke-width:1.6;stroke-dasharray:3 3}
  .anim g{transform-box:view-box}
  /* joints, angle arcs and form guide-lines */
  .anim .joint{fill:#e8ebf0;stroke:none}
  .anim .joint-hl{fill:var(--accent);stroke:none}
  .anim .arc{stroke:var(--accent);stroke-width:1.6;fill:none;opacity:.85}
  .anim .guide{stroke:#5b6577;stroke-width:1.4;stroke-dasharray:4 4;fill:none}
  .anim .deg{fill:var(--accent);font-size:9px;font-weight:800;font-family:system-ui,sans-serif;stroke:none}
  .ex-cue{font-size:12px;color:var(--accent);font-weight:600;margin-top:4px;line-height:1.35}
  .ex-cue::before{content:"▸ "}

  /* --- articulated joint animations: upper arm rotates at the shoulder,
         forearm rotates again at the elbow (nested group) --- */
  @keyframes benchUA{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(0)}}
  @keyframes benchFA{0%,100%{transform:rotate(110deg)}50%{transform:rotate(0)}}
  @keyframes benchBar{0%,100%{transform:translate(4px,15px)}50%{transform:translate(0,0)}}

  @keyframes incUA{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(0)}}
  @keyframes incFA{0%,100%{transform:rotate(100deg)}50%{transform:rotate(0)}}
  @keyframes incDb{0%,100%{transform:translate(-5px,15px)}50%{transform:translate(0,0)}}

  @keyframes prLUA{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(-15deg)}}
  @keyframes prLFA{0%,100%{transform:rotate(95deg)}50%{transform:rotate(0)}}
  @keyframes prRUA{0%,100%{transform:rotate(95deg)}50%{transform:rotate(15deg)}}
  @keyframes prRFA{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(0)}}
  @keyframes prLDb{0%,100%{transform:translate(-6px,17px)}50%{transform:translate(0,0)}}
  @keyframes prRDb{0%,100%{transform:translate(6px,17px)}50%{transform:translate(0,0)}}
  @keyframes arnoldTwist{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}

  @keyframes latL{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-88deg)}}
  @keyframes latR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(88deg)}}
  @keyframes flyL{0%,100%{transform:rotate(-64deg)}50%{transform:rotate(-8deg)}}
  @keyframes flyR{0%,100%{transform:rotate(64deg)}50%{transform:rotate(8deg)}}
  @keyframes pushFA{0%,100%{transform:rotate(-88deg)}50%{transform:rotate(0)}}

  @keyframes pdUA{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(12deg)}}
  @keyframes pdFA{0%,100%{transform:rotate(0)}50%{transform:rotate(70deg)}}
  @keyframes pdBar{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}

  @keyframes rowUA{0%,100%{transform:rotate(0)}50%{transform:rotate(30deg)}}
  @keyframes rowFA{0%,100%{transform:rotate(0)}50%{transform:rotate(-92deg)}}
  @keyframes rowBar{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-17px)}}

  @keyframes srUA{0%,100%{transform:rotate(78deg)}50%{transform:rotate(6deg)}}
  @keyframes srFA{0%,100%{transform:rotate(0)}50%{transform:rotate(-78deg)}}
  @keyframes srHandle{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}

  @keyframes saArm{0%,100%{transform:rotate(-52deg)}50%{transform:rotate(16deg)}}
  @keyframes fpUA{0%,100%{transform:rotate(0)}50%{transform:rotate(-46deg)}}
  @keyframes fpFA{0%,100%{transform:rotate(0)}50%{transform:rotate(-72deg)}}
  @keyframes fpHandle{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
  @keyframes curlFA{0%,100%{transform:rotate(0)}50%{transform:rotate(-140deg)}}

  @keyframes sqHip{0%,100%{transform:translate(0,0)}50%{transform:translate(-7px,17px)}}
  @keyframes sqThigh{0%,100%{transform:rotate(0)}50%{transform:rotate(52deg)}}
  @keyframes sqShin{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
  @keyframes sqTorso{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}

  @keyframes rdlHip{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,3px)}}
  @keyframes rdlTorso{0%,100%{transform:rotate(0)}50%{transform:rotate(72deg)}}
  @keyframes rdlBar{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,17px)}}

  @keyframes lpThigh{0%,100%{transform:rotate(0)}50%{transform:rotate(-40deg)}}
  @keyframes lpShin{0%,100%{transform:rotate(0)}50%{transform:rotate(40deg)}}
  @keyframes lpSled{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,9px)}}

  @keyframes clatArm{0%,100%{transform:rotate(4deg)}50%{transform:rotate(86deg)}}
  @keyframes crSpine{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(42deg)}}
  @keyframes walkL{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
  @keyframes walkR{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Easy<span>Fitness</span></h1>
    <button class="profile-chip" id="profileChip" onclick="openPicker()"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"></main>

<div class="rest-timer" id="restTimer">
  <div class="ring">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#2a2f3c" stroke-width="5"/>
      <circle id="ringFg" cx="28" cy="28" r="24" fill="none" stroke="var(--accent)" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"/>
    </svg>
    <div class="num" id="ringNum">90</div>
  </div>
  <div class="lbl"><b>Rest</b><span>Next set coming up…</span></div>
  <button onclick="addRest(30)">+30s</button>
  <button class="skip" onclick="stopRest()">Skip</button>
</div>

<div class="toast" id="toast"></div>
<div class="picker" id="picker" style="display:none"></div>

<script>
/* =====================================================================
   PROGRAM DATA MODEL
   A "program" is a single shareable object. In a future multi-user
   platform, programs like this one can be published, shared and voted
   on — the tracker below only *consumes* this structure.
===================================================================== */
const PROGRAM = {
  id: "ppl-3day-v1",
  name: "3-Day Push / Pull / Legs",
  author: "EasyFitness",
  version: 1,
  days: [
    {
      id: "day1", short: "Day 1", title: "Push", subtitle: "Chest • Shoulders • Triceps",
      cardio: "15–20 min incline walk (8–12% incline)",
      exercises: [
        { id:"bench",      name:"Barbell Bench Press",            sets:4, reps:"6–8",   anim:"bench",      db:false, w:"65-70",
          cue:"Elbows ~45° to the torso, not flared to 90°. Shoulder blades pinned back, slight arch, bar to lower chest." },
        { id:"incline",    name:"Incline Dumbbell Press",         sets:3, reps:"8–10",  anim:"incline",    db:true,  w:"22.5",
          cue:"Bench at 30–45°. Steeper turns it into a shoulder press. Lower to upper chest, elbows under the wrists." },
        { id:"shpress",    name:"Seated Dumbbell Shoulder Press", sets:3, reps:"8–10",  anim:"press",      db:true,  w:"20",
          cue:"Upper arms ~30° in front of the body, not straight out to the sides. Ribs down, don't arch the lower back." },
        { id:"latraise",   name:"Lateral Raise",                  sets:4, reps:"12–15", anim:"lateral",    db:true,  w:"10",
          cue:"Slight forward lean, elbows softly bent ~10–20° and kept above the wrists. Stop at shoulder height, no swinging." },
        { id:"fly",        name:"Cable Fly",                      sets:3, reps:"12–15", anim:"fly",        db:false, w:"40-45",
          cue:"Small forward lean, elbow angle stays fixed at ~20° the whole rep. Hug motion — chest opens, shoulders stay down." },
        { id:"pushdown",   name:"Rope Triceps Pushdown",          sets:3, reps:"10–12", anim:"pushdown",   db:false, w:"40-45",
          cue:"Slight forward lean, upper arms glued to the ribs. Only the elbow moves, from ~90° to full lockout." },
      ]
    },
    {
      id: "day2", short: "Day 2", title: "Pull", subtitle: "Back • Lats • Biceps",
      cardio: "15–20 min intervals (rower/bike: 1 min fast / 2 min slow)",
      exercises: [
        { id:"pulldown",   name:"Lat Pulldown (wide grip)",       sets:4, reps:"8–10",  anim:"pulldown",   db:false, w:null,
          cue:"Lean back ~15–20° and hold it — don't rock. Bar to collarbone, elbows drive down and back, chest up." },
        { id:"bbrow",      name:"Barbell Row",                    sets:4, reps:"8–10",  anim:"row",        db:false, w:null,
          cue:"Hinge to ~45° torso angle, back flat, knees softly bent. Pull to the belly button, elbows ~45° — no jerking up." },
        { id:"cablerow",   name:"Seated Cable Row",               sets:3, reps:"10–12", anim:"seatedrow",  db:false, w:null,
          cue:"Torso stays near vertical (max ~10° sway). Knees slightly bent, pull to the navel, squeeze the shoulder blades." },
        { id:"straightarm",name:"Straight-Arm Pulldown",          sets:3, reps:"12–15", anim:"straightarm",db:false, w:null,
          cue:"Hinge forward ~30° at the hips — do NOT stand upright. Arms nearly straight (~10° elbow), only the shoulder moves; sweep the bar to the thighs." },
        { id:"facepull",   name:"Face Pull",                      sets:3, reps:"15",    anim:"facepull",   db:false, w:null,
          cue:"Cable at face height. Pull to the forehead with elbows HIGH, at shoulder level, and rotate hands back — like a double biceps pose." },
        { id:"hammercurl", name:"Dumbbell Hammer Curl",           sets:3, reps:"10–12", anim:"curl",       db:true,  w:"15",
          cue:"Elbows pinned at the ribs, neutral grip. Torso doesn't swing — the elbow travels from 180° to ~40°." },
      ]
    },
    {
      id: "day3", short: "Day 3", title: "Legs + Shoulders", subtitle: "Legs • Shoulders • Core",
      cardio: "15–20 min incline walk",
      exercises: [
        { id:"squat",      name:"Squat",                          sets:4, reps:"8–10",  anim:"squat",      db:false, w:null,
          cue:"Hips and knees bend together, chest up. Go to at least 90° knee bend (thigh parallel). Knees track over the toes, heels stay down." },
        { id:"rdl",        name:"Romanian Deadlift",              sets:3, reps:"10–12", anim:"rdl",        db:false, w:null,
          cue:"Hip hinge, NOT a squat: push the hips back, knees stay at a soft ~15° bend. Back flat, bar slides along the legs, stop at mid-shin." },
        { id:"legpress",   name:"Leg Press",                      sets:3, reps:"10–12", anim:"legpress",   db:false, w:"100-120",
          cue:"Lower until the knee is ~90°. Lower back must stay glued to the pad — if the hips lift, you went too deep. Don't lock the knees out hard." },
        { id:"arnold",     name:"Arnold Press",                   sets:3, reps:"10–12", anim:"arnold",     db:true,  w:"12",
          cue:"Start palms facing you at chin height, rotate 180° outward as you press. Elbows stay ~30° in front, ribs down." },
        { id:"cablelat",   name:"Cable Lateral Raise",            sets:3, reps:"12–15", anim:"cablelat",   db:false, w:null,

        { id:"crunch",     name:"Cable Crunch + Plank",           sets:3, reps:"15 + 40s plank", anim:"crunch", db:false, w:null,
          cue:"Crunch: hips stay fixed, round the spine and bring the ribs to the pelvis — it's not a hip hinge. Plank: body in one straight line, hips neither sagging nor piked." },

const NOTES = [
  "<b>Progressive overload:</b> if you hit the top of the rep range in 2 consecutive workouts, increase the weight by 2.5–5%.",
  "<b>Rest:</b> 90–120 s on compound lifts, 60 s on isolation exercises.",
  "<b>Waist circumference</b> is the main progress indicator — measure every 2 weeks and log it in the History tab (body weight + waist, per user).",
];

/* ============================ STATE ============================
   One profile per device: the person types their own name once.
   All training data hangs off that single profile.
============================================================== */
const LS_KEY = "easyfitness_v1";
let state = loadState();
let editingEx = null; // exercise id currently in weight-edit mode

function defaultState(){
  return {
    name: null,          // typed once on this device, then remembered
    tab: "day1",
    weights: {},         // weights[exId] = "65-70"
    sets:    {},         // sets[dayId][exId] = [bool,...]
    cardio:  {},         // cardio[dayId] = bool
    history: [],         // finished workouts
    measurements: [],    // {date,weight,waist}
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    return migrate(Object.assign(defaultState(), JSON.parse(raw)));
  }catch(e){ return defaultState(); }
}
// carry over data saved by the earlier two-profile version
function migrate(s){
  if(s.user && s.weights && (s.weights.ugur || s.weights.onur)){
    const k = s.user;
    s.name = k === "onur" ? "Onur" : "Uğur";
    s.weights = s.weights[k] || {};
    s.sets    = (s.sets   && s.sets[k])   || {};
    s.cardio  = (s.cardio && s.cardio[k]) || {};
    s.history = (s.history||[]).filter(h=>h.user===k);
    s.measurements = (s.measurements||[]).filter(m=>m.user===k);
    delete s.user;
  }
  return s;
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function getWeight(ex){
  const ov = state.weights[ex.id];
  return (ov !== undefined) ? ov : ex.w;
}
function getSets(dayId, ex){
  if(!state.sets[dayId]) state.sets[dayId] = {};
  const d = state.sets[dayId];
  if(!d[ex.id] || d[ex.id].length !== ex.sets) d[ex.id] = Array(ex.sets).fill(false);
  return d[ex.id];
}

/* ====================== WEIGHT FORMAT HELPERS ====================== */
function fmtNum(n){
  return (Math.round(n*10)/10).toString().replace(/\.0$/,"");
}
// shift every number in a weight string (supports ranges like "65-70")
function shiftWeight(str, delta){
  if(!str) return delta > 0 ? fmtNum(delta) : null;
  return str.replace(/\d+(\.\d+)?/g, m => fmtNum(Math.max(0, parseFloat(m) + delta)));
}
function weightLabel(str){ return str ? str.replace(/-/g,"–") + " kg" : null; }

/* ============================ RENDER ============================ */
function render(){
  if(!state.name){ showPicker(); return; }
  document.getElementById("picker").style.display = "none";
  renderHeader();
  const m = document.getElementById("main");
  if(state.tab === "history") m.innerHTML = historyHTML();
  else m.innerHTML = dayHTML(PROGRAM.days.find(d=>d.id===state.tab));
}

function showPicker(){
  const p = document.getElementById("picker");
  p.style.display = "flex";
  p.innerHTML = `
    <h2>What's your name?</h2>
    <p>Type it once — this device will remember you.<br>Your weights and history stay on this phone.</p>
    <input id="nameInput" class="name-input" placeholder="Your name" autocomplete="name"
           value="${(state.name||"").replace(/"/g,'&quot;')}"
           onkeydown="if(event.key==='Enter')confirmName()">
    <button onclick="confirmName()">OK</button>`;
  setTimeout(()=>{ const i=document.getElementById("nameInput"); if(i) i.focus(); },60);
}
function confirmName(){
  const v = document.getElementById("nameInput").value.trim();
  if(!v){ toast("Please type a name"); return; }
  state.name = v.slice(0,24);
  save(); render();
  toast("Welcome, " + state.name + "! 💪");
}
function openPicker(){ showPicker(); }   // tap the chip to rename — data is kept

function renderHeader(){
  document.getElementById("profileChip").innerHTML = `👤 ${state.name}`;
  const tabs = PROGRAM.days.map(d =>
    `<button class="${state.tab===d.id?'active':''}" onclick="switchTab('${d.id}')">${d.short}<span class="sub">${d.title}</span></button>`).join("")
    + `<button class="${state.tab==='history'?'active':''}" onclick="switchTab('history')">History<span class="sub">Log</span></button>`;
  document.getElementById("tabs").innerHTML = tabs;
}

function dayHTML(day){
  const totalSets = day.exercises.reduce((a,e)=>a+e.sets,0) + 1; // +1 cardio
  let doneSets = 0;
  day.exercises.forEach(e => { doneSets += getSets(day.id,e).filter(Boolean).length; });
  if(state.cardio[day.id]) doneSets++;
  const pct = Math.round(doneSets/totalSets*100);

  let html = `
    <div class="day-progress">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span>${doneSets}/${totalSets} sets</span>
    </div>`;

  html += day.exercises.map(ex => cardHTML(day, ex)).join("");

  const cOn = !!state.cardio[day.id];
  html += `
    <div class="cardio ${cOn?'on':''}" onclick="toggleCardio('${day.id}')">
      <div class="chk">✓</div>
      <div class="anim" style="width:64px;height:56px">${ANIMS.cardio()}</div>
      <div><div class="t">CARDIO</div><div class="d">${day.cardio}</div></div>
    </div>
    <button class="finish-btn" onclick="finishWorkout('${day.id}')">🏁 Finish Workout</button>
    <details class="notes"><summary>Notes</summary><ul>${NOTES.map(n=>`<li>${n}</li>`).join("")}</ul></details>`;
  return html;
}

function cardHTML(day, ex){
  const done = getSets(day.id, ex).every(Boolean);
  const w = getWeight(ex);
  const editing = editingEx === ex.id;

  const weightPart = editing ? `
    <div class="weight-edit">
      <button onclick="bumpWeight('${ex.id}',-2.5)">−</button>
      <input id="winput" value="${w||''}" placeholder="e.g. 40 or 40-45" inputmode="decimal"
             onkeydown="if(event.key==='Enter')saveWeight('${ex.id}')">
      <button onclick="bumpWeight('${ex.id}',2.5)">+</button>
      <button class="save" onclick="saveWeight('${ex.id}')">OK</button>
    </div>` : `
    <div class="weight-row">
      <span class="weight-chip ${w?'':'empty'}" onclick="startEdit('${ex.id}')">
        ${w ? `${weightLabel(w)} ${ex.db?'<span class="db-tag">DUMBBELL</span>':''}` : 'enter weight ✏️'}
      </span>
    </div>`;

  const sets = getSets(day.id, ex).map((on,i) =>
    `<div class="set-box ${on?'on':''}" onclick="toggleSet('${day.id}','${ex.id}',${i})">${on?'✓':'S'+(i+1)}</div>`).join("");

  return `
    <div class="card ${done?'done':''}">
      <div class="card-top">
        <div class="anim">${(ANIMS[ex.anim]||ANIMS.press)()}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${ex.sets} × ${ex.reps}</div>
          ${ex.cue?`<div class="ex-cue">${ex.cue}</div>`:""}
          <div class="done-badge">✓ Completed</div>
          ${weightPart}
        </div>
      </div>
      <div class="sets">${sets}</div>
    </div>`;
}

/* ============================ ACTIONS ============================ */
function switchTab(id){ state.tab = id; editingEx = null; save(); render(); }

function startEdit(exId){ editingEx = exId; render();
  setTimeout(()=>{ const i=document.getElementById("winput"); if(i){i.focus();} },50); }
function bumpWeight(exId){ // reads current input, shifts, writes back
  const input = document.getElementById("winput");
  const delta = arguments[1];
  input.value = shiftWeight(input.value.trim(), delta) || "";
}
function saveWeight(exId){
  const v = document.getElementById("winput").value.trim();
  state.weights[exId] = v || null;
  editingEx = null;
  save(); render();
  toast("Weight saved");
}

function findEx(dayId, exId){
  return PROGRAM.days.find(d=>d.id===dayId).exercises.find(e=>e.id===exId);
}
function toggleSet(dayId, exId, i){
  const ex = findEx(dayId, exId);
  const arr = getSets(dayId, ex);
  arr[i] = !arr[i];
  save(); render();
  if(arr[i]) startRest();
  if(arr.every(Boolean)) toast(ex.name + " done! 💪");
}
function toggleCardio(dayId){
  state.cardio[dayId] = !state.cardio[dayId];
  save(); render();
}

function finishWorkout(dayId){
  const day = PROGRAM.days.find(d=>d.id===dayId);
  const entries = day.exercises.map(ex=>{
    const s = getSets(dayId, ex);
    return { name: ex.name, weight: getWeight(ex), done: s.filter(Boolean).length, total: ex.sets };
  });
  const anyDone = entries.some(e=>e.done>0) || state.cardio[dayId];
  if(!anyDone){ toast("No sets completed yet"); return; }
  if(!confirm("Finish this workout and save it to history?")) return;
  state.history.unshift({
    date: new Date().toISOString(),
    dayId, dayTitle: day.short + " — " + day.title,
    exercises: entries,
    cardioDone: !!state.cardio[dayId],
  });
  state.sets[dayId] = {};
  state.cardio[dayId] = false;
  stopRest();
  save(); render();
  toast("Workout saved to history 🏁");
}

/* ============================ HISTORY ============================ */
function fmtDate(iso){
  return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) +
    " · " + new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function historyHTML(){
  const uName = state.name;
  const meas = state.measurements;
  const hist = state.history;

  let html = `
    <div class="section-title">📏 Body Measurements — ${uName}</div>
    <div class="measure-form">
      <div class="row">
        <label>Body weight (kg)<input id="mWeight" inputmode="decimal" placeholder="96"></label>
        <label>Waist (cm)<input id="mWaist" inputmode="decimal" placeholder="100"></label>
      </div>
      <button onclick="addMeasurement()">＋ Save measurement</button>
    </div>`;

  html += meas.length
    ? `<div style="margin-top:12px">` + meas.map(m=>
        `<div class="m-item"><div>⚖️ ${m.weight||"—"} kg &nbsp; 📐 ${m.waist||"—"} cm</div><span>${fmtDate(m.date)}</span></div>`).join("") + `</div>`
    : `<div class="empty">No measurements yet. Measure your waist every 2 weeks!</div>`;

  html += `<div class="section-title">🏋️ Workout History — ${uName}</div>`;
  html += hist.length ? hist.map(h=>`
    <div class="hist-item">
      <div class="h"><b>${h.dayTitle}</b><span>${fmtDate(h.date)}</span></div>
      <ul>${h.exercises.map(e=>
        `<li><em>${e.name}</em><span>${e.weight?weightLabel(e.weight):"—"} · ${e.done}/${e.total} sets</span></li>`).join("")}
      </ul>
      ${h.cardioDone?'<div class="cardio-done">✓ Cardio completed</div>':''}
    </div>`).join("")
    : `<div class="empty">No workouts yet. Finish a workout and it will show up here.</div>`;
  return html;
}
function addMeasurement(){
  const w = document.getElementById("mWeight").value.trim();
  const c = document.getElementById("mWaist").value.trim();
  if(!w && !c){ toast("Enter at least one value"); return; }
  state.measurements.unshift({ date:new Date().toISOString(), weight:w, waist:c });
  save(); render();
  toast("Measurement saved 📏");
}

/* ============================ REST TIMER ============================ */
const REST_SECONDS = 90;
let restLeft = 0, restTotal = REST_SECONDS, restInt = null;
function startRest(){
  restLeft = REST_SECONDS; restTotal = REST_SECONDS;
  document.getElementById("restTimer").classList.add("show");
  tickRest();
  clearInterval(restInt);
  restInt = setInterval(()=>{
    restLeft--;
    if(restLeft<=0){
      stopRest();
      toast("Rest over — next set! 🔥");
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    } else tickRest();
  },1000);
}
function tickRest(){
  document.getElementById("ringNum").textContent = restLeft;
  const C = 150.8;
  document.getElementById("ringFg").style.strokeDashoffset = C * (1 - restLeft/restTotal);
}
function addRest(s){ restLeft += s; restTotal = Math.max(restTotal, restLeft); tickRest(); }
function stopRest(){
  clearInterval(restInt); restInt = null;
  document.getElementById("restTimer").classList.remove("show");
}

/* ============================ TOAST ============================ */
let toastTO = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTO);
  toastTO = setTimeout(()=>t.classList.remove("show"), 2200);
}
